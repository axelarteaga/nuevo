<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nosotros ❤️</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/corazones.css">

</head>

<body>

    <div class="contenedor">

        <div class="corazon">
            ❤️
        </div>

        <h1>Para ti</h1>

        <p class="mensaje-inicial">
            Hay un pequeño lugar que hice especialmente
            para nosotros.
            <br>
            Pero primero necesito saber que eres tú. ❤️
            <br>
            DD/MM/AA
        </p>

        <input
            type="password"
            id="password"
            placeholder="Nuestra clave"
            maxlength="6"
            inputmode="numeric"
        >

        <button id="boton-entrar">
            Entrar ❤️
        </button>

        <p id="mensaje-error"></p>

    </div>


    <script src="js/login.js"></script>
    <script src="js/corazones.js"></script>

</body>

</html>
