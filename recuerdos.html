<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuestros recuerdos ❤️</title>

    <link rel="stylesheet" href="css/recuerdos.css">
    <link rel="stylesheet" href="css/corazones.css">

</head>

<body>

    <main class="contenedor">

        <p class="pequeno">
            Algunos momentos
        </p>

        <h1>
            Nuestros recuerdos ❤️
        </h1>

        <p class="descripcion">
            Cada fotografía guarda un momento
            que quiero recordar contigo.
        </p>


        <div class="escena">

            <div class="carrusel" id="carrusel">

                <div class="foto">
                    <img src="img/foto1.jpeg" alt="Nuestro recuerdo 1">
                </div>

                <div class="foto">
                    <img src="img/foto2.jpeg" alt="Nuestro recuerdo 2">
                </div>

                <div class="foto">
                    <img src="img/foto3.jpeg" alt="Nuestro recuerdo 3">
                </div>

                <div class="foto">
                    <img src="img/foto4.jpeg" alt="Nuestro recuerdo 4">
                </div>

                <div class="foto">
                    <img src="img/foto5.jpeg" alt="Nuestro recuerdo 5">
                </div>

            </div>

        </div>


        <div class="controles">

            <button id="anterior">
                ❮
            </button>

            <button id="siguiente">
                ❯
            </button>

        </div>

        <button
            class="volver"
            onclick="location.href='inicio.html'">

            ← Volver

        </button>

    </main>


    <script src="js/recuerdos.js"></script>
    <script src="js/corazones.js"></script>

</body>

</html>
